<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<h1>Price Calculator</h1>

<form>
    <label for="coffeeName">Coffee Name/Type:</label>
    <input type="text" id="coffeeName">

    <label for="priceInputMethod">Coffee Price Input Method:</label>
    <select id="priceInputMethod" onchange="togglePriceInputMethod()">
        <option value="perKg">Price per kg</option>
        <option value="totalBag">Total bag price & weight</option>
    </select>

    <div id="perKgInput">
        <label>Green Coffee Price per kg (OMR):</label>
        <input type="number" id="greenCoffeePrice" step="0.01">
    </div>

    <div id="totalBagInput" style="display:none;">
        <label>Total Bag Price (OMR):</label>
        <input type="number" id="bagTotalPrice" step="0.01" oninput="calculatePricePerKg()">

        <label>Total Bag Weight (grams):</label>
        <input type="number" id="bagTotalWeight" step="1" oninput="calculatePricePerKg()">

        <div id="calculatedPricePerKg" class="calculated-value" style="display:none;">
            Calculated Price per kg: <span id="pricePerKgValue">0.00</span> OMR
        </div>
    </div>

    <label>Roast Loss (%):</label>
    <input type="number" id="roastLoss" step="0.01">

    <label>Package Weight (grams):</label>
    <input type="number" id="packageWeight" step="0.1">

    <label>Packaging Cost (OMR):</label>
    <input type="number" id="packagingCost" step="0.01">

    <label>Pricing Option:</label>
    <select id="pricingOption" onchange="togglePricingOption()">
        <option value="profitMargin">Profit Margin (%)</option>
        <option value="fixedPrice">Fixed Selling Price</option>
    </select>

    <div id="profitMarginInput">
        <label>Profit Margin (%):</label>
        <input type="number" id="profitMargin" step="0.01">
    </div>

    <div id="fixedPriceInput" style="display:none;">
        <label>Fixed Price (OMR):</label>
        <input type="number" id="fixedPrice" step="0.01">
    </div>

    <label>Discount (%):</label>
    <input type="number" id="discount" step="0.01">

    <div class="buttons">
        <button type="button" onclick="calculatePrice()">Calculate</button>
        <button type="button" onclick="resetForm()">Reset</button>
    </div>
</form>

<table id="resultsTable">
    <tr><th>Base Cost</th><td id="baseCost">0.00 OMR</td></tr>
    <tr><th>Selling Price</th><td id="sellingPrice">0.00 OMR</td></tr>
    <tr><th>Profit Margin</th><td id="calculatedProfitMargin">0.00%</td></tr>
    <tr><th>Profit Before Discount</th><td id="profitBeforeDiscount">0.00 OMR</td></tr>
    <tr><th>Discount</th><td id="discountAmount">0.00 OMR</td></tr>
    <tr><th>Final Price</th><td id="finalPrice">0.00 OMR</td></tr>
    <tr><th>Profit After Discount</th><td id="profitAfterDiscount">0.00 OMR</td></tr>
</table>

<button id="copyButton" onclick="copyResults()">Copy Results</button>

<script src="script.js"></script>
</body>
</html>
